{% extends "base.html" %}

{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card login-card">
          <div class="card-body login-card-body">
            <div class="text-center mb-4">
              <div class="mb-3">
                <i class="bi bi-key-fill"></i>
              </div>
              <h1 class="mb-2">Forgot Password?</h1>
              <p class="text-secondary">
                Enter your registered email address and we will guide you through the reset process.
              </p>
            </div>

            <form action="/forgotPassword" method="POST">
              <div class="mb-4">
                <label for="email" class="form-label fw-semibold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-end-0">
                    <i class="bi bi-envelope-fill text-secondary"></i>
                  </span>
                  <input type="email" class="form-control" id="email" name="email" placeholder="Enter your registered email" required>
                </div>
              </div>

              <button type="submit" class="btn btn-primary-custom text-white w-100 py-3 fw-bold rounded-3 mb-3">
                <i class="bi bi-send-fill me-2"></i>Send Reset Link
              </button>

              <div class="text-center">
                <a href="/login" class="text-decoration-none signup-link">
                  <i class="bi bi-arrow-left me-1"></i>Back to Login
                </a>
              </div>
            </form>
          </div>
        </div>

        <div class="text-center mt-4">
          <p class="small text-secondary">
            <i class="bi bi-shield-check me-1"></i>
            We take security seriously.
          </p>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
