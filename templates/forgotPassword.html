{% extends "base.html" %}

{% block content %}
<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5 col-lg-4">
                
                <!-- Back Link -->
                <a href="/login" class="back-link mb-4">
                    <i class="bi bi-arrow-left"></i> Back to Login
                </a>

                <!-- Forgot Password Card -->
                <div class="auth-card animate-fade-in-scale">
                    <div class="auth-card-body">
                        
                        <!-- Header -->
                        <div class="auth-header text-center mb-4">
                            <div class="auth-icon mb-3">
                                <i class="bi bi-key"></i>
                            </div>
                            <h2>Forgot Password?</h2>
                            <p>Enter your email to reset your password</p>
                        </div>

                        <!-- Forgot Password Form -->
                        <form action="/forgotPassword" method="POST">
                            
                            <!-- Email -->
                            <div class="mb-4">
                                <label for="email" class="form-label">
                                    <i class="bi bi-envelope"></i> Email Address
                                </label>
                                <input 
                                    type="email" 
                                    class="form-control form-control-lg" 
                                    id="email" 
                                    name="email" 
                                    placeholder="Enter your registered email" 
                                    required
                                >
                            </div>

                            <!-- Submit -->
                            <button type="submit" class="btn btn-primary-custom w-100 btn-lg mb-3">
                                <i class="bi bi-send"></i> Send Reset Link
                            </button>

                            <!-- Back to Login -->
                            <p class="text-center auth-footer-text">
                                <a href="/login" class="fw-semibold">
                                    <i class="bi bi-arrow-left"></i> Back to Login
                                </a>
                            </p>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Background Decoration -->
    <div class="bg-decoration">
        <div class="deco-circle deco-1"></div>
        <div class="deco-circle deco-2"></div>
    </div>
</div>
{% endblock %}
