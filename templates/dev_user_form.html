{% extends "base.html" %}

{% block content %}
<div class="auth-page">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <a href="/dev/users" class="back-link mb-4">
                    <i class="bi bi-arrow-left"></i> Back to Users
                </a>

                <div class="auth-card">
                    <div class="auth-card-body">
                        
                        <div class="auth-header text-center mb-4">
                            <div class="auth-icon mb-3">
                                <i class="bi bi-{{ 'pencil-square' if user else 'person-plus' }}"></i>
                            </div>
                            <h2>{{ title }}</h2>
                        </div>

                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" name="username" class="form-control form-control-lg" 
                                       value="{{ user.username if user else '' }}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control form-control-lg" 
                                       value="{{ user.email if user else '' }}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control form-control-lg" 
                                       {% if title == 'Add User' %}required{% endif %}
                                       placeholder="{% if title == 'Edit User' %}Leave blank to keep unchanged{% else %}Min 8 characters{% endif %}">
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" name="confirm" class="form-control form-control-lg" 
                                       {% if title == 'Add User' %}required{% endif %}>
                            </div>

                            <button type="submit" class="btn btn-primary-custom w-100 btn-lg mb-3">
                                <i class="bi bi-check-lg"></i> Save User
                            </button>
                            
                            <a href="/dev/users" class="btn btn-outline-secondary w-100">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
