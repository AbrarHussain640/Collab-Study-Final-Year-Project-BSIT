{% extends "base.html" %}

{% block content %}
<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5 col-lg-4">
                
                <!-- Back Link -->
                <a href="/" class="back-link mb-4">
                    <i class="bi bi-arrow-left"></i> Back to Home
                </a>

                <!-- Login Card -->
                <div class="auth-card animate-fade-in-scale">
                    <div class="auth-card-body">
                        
                        <!-- Header -->
                        <div class="auth-header text-center mb-4">
                            <div class="auth-icon mb-3">
                                <i class="bi bi-person-circle"></i>
                            </div>
                            <h2>Welcome Back</h2>
                            <p>Sign in to continue to <span class="text-primary-custom">CollabStudy</span></p>
                        </div>

                        <!-- Login Form -->
                        <form action="/login" method="POST" id="loginForm">
                            
                            <!-- Username/Email -->
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    <i class="bi bi-person"></i> Username or Email
                                </label>
                                <input 
                                    type="text" 
                                    class="form-control form-control-lg" 
                                    id="username" 
                                    name="username" 
                                    placeholder="Enter your username or email" 
                                    required 
                                    autofocus
                                >
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="bi bi-lock"></i> Password
                                </label>
                                <input 
                                    type="password" 
                                    class="form-control form-control-lg" 
                                    id="password" 
                                    name="password" 
                                    placeholder="Enter your password" 
                                    required
                                >
                            </div>

                            <!-- Remember & Forgot -->
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe" name="remember">
                                    <label class="form-check-label" for="rememberMe">Remember me</label>
                                </div>
                                <a href="/forgotPassword" class="forgot-link">Forgot Password?</a>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" class="btn btn-primary-custom w-100 btn-lg mb-3" id="loginBtn">
                                <span id="loginText">Sign In</span>
                                <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                            </button>

                            <!-- Register Link -->
                            <p class="text-center auth-footer-text">
                                Don't have an account? 
                                <a href="/register" class="fw-semibold">Create Account</a>
                            </p>

                        </form>
                    </div>
                </div>

                <!-- Footer -->
                <div class="text-center mt-3">
                    <p class="auth-footer-note">
                        <i class="bi bi-shield-check"></i> Secure Login
                    </p>
                </div>

            </div>
        </div>
    </div>

    <!-- Background Decoration -->
    <div class="bg-decoration">
        <div class="deco-circle deco-1"></div>
        <div class="deco-circle deco-2"></div>
    </div>
</div>

<!-- Login Form Script -->
<script>
    document.getElementById('loginForm')?.addEventListener('submit', function(e) {
        const btn = document.getElementById('loginBtn');
        const text = document.getElementById('loginText');
        const spinner = document.getElementById('loginSpinner');
        
        btn.disabled = true;
        text.textContent = 'Signing in...';
        spinner.classList.remove('d-none');
    });

    document.addEventListener('DOMContentLoaded', function() {
        const btn = document.getElementById('loginBtn');
        const text = document.getElementById('loginText');
        const spinner = document.getElementById('loginSpinner');
        if (btn && btn.disabled) {
            btn.disabled = false;
            text.textContent = 'Sign In';
            spinner.classList.add('d-none');
        }
    });
</script>
{% endblock %}
