{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title text-center">Create New Study Room</h3>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Room Name</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description (optional)</label>
                            <textarea name="description" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Course Code (unique, e.g., CS101)</label>
                            <input type="text" name="course_code" class="form-control" required>
                            <div class="form-text">This code will be unique for each subject. Only one room per course code.</div>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100">Create Room</button>
                        <a href="/rooms" class="btn btn-secondary w-100 mt-2">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
