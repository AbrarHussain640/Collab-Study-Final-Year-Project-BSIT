{% extends "base.html" %}

{% block content %}
<div class="auth-page">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <div class="auth-card animate-fade-in-scale">
                    <div class="auth-card-body text-center">
                        
                        <!-- Lock Icon -->
                        <div class="auth-icon mb-3">
                            <i class="bi bi-lock-fill text-warning"></i>
                        </div>
                        
                        <h3>Private Room</h3>
                        <p class="text-muted-custom mb-4">This room is password protected. Enter the password to join.</p>

                        <form action="/rooms/join" method="POST">
                            <input type="hidden" name="room_code" value="{{ room_code }}">
                            
                            <div class="mb-4">
                                <input type="password" name="room_password" class="form-control form-control-lg" 
                                       placeholder="Enter room password" required autofocus>
                            </div>

                            <button type="submit" class="btn btn-primary-custom w-100 btn-lg mb-3">
                                <i class="bi bi-door-open"></i> Join Room
                            </button>
                            
                            <a href="/rooms" class="btn btn-outline-secondary w-100">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
