{% extends "base.html" %}

{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-5">
            <h1 class="text-center mb-4">Register to <span class="text-gradient">CollabStudy</span></h1>

            <form action="/register" method="POST" id="registerForm">
              <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <input type="text" class="form-control form-control-lg rounded-3" id="username" name="username" placeholder="Choose a username" required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email Address</label>
                <input type="email" class="form-control form-control-lg rounded-3" id="email" name="email" placeholder="Enter your email" required>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control form-control-lg rounded-3" id="password" name="password" placeholder="Create a password" required minlength="8">
                <div class="form-text">At least 8 characters</div>
              </div>

              <div class="mb-4">
                <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                <input type="password" class="form-control form-control-lg rounded-3" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required>
                <div class="form-text" id="passwordMatchMsg">Passwords must match</div>
              </div>

              <div class="mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="terms" required>
                  <label class="form-check-label" for="terms">
                    I agree to the <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>
                  </label>
                </div>
              </div>

              <button type="submit" class="btn btn-primary-custom text-white w-100 py-3 fw-bold rounded-3 mb-3">
                Register Now
              </button>

              <p class="text-center mb-0">
                Already have an account?
                <a href="/login" class="text-decoration-none fw-semibold">Log in</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const pwd = document.getElementById('password');
    const cpwd = document.getElementById('confirmPassword');
    const msg = document.getElementById('passwordMatchMsg');

    function validate() {
      if (pwd.value !== cpwd.value) {
        msg.innerHTML = '❌ Passwords do not match';
        msg.style.color = '#ef4444';
        return false;
      }
      msg.innerHTML = '✅ Passwords match';
      msg.style.color = '#10b981';
      return true;
    }

    pwd.addEventListener('input', validate);
    cpwd.addEventListener('input', validate);

    form.addEventListener('submit', function (event) {
      if (!validate()) {
        event.preventDefault();
        alert('Passwords do not match.');
      } else if (pwd.value.length < 8) {
        event.preventDefault();
        alert('Password must be at least 8 characters.');
      }
    });
  </script>
{% endblock %}
